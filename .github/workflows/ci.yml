name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Dart ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `stable` is the primary target; the second entry is the lower bound
        # of the SDK constraint in pubspec.yaml, kept honest by running here.
        sdk: [stable, 3.8.0]
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
        if: matrix.sdk == 'stable'
      - run: dart analyze --fatal-infos
        if: matrix.sdk == 'stable'
      - run: dart test --platform vm
